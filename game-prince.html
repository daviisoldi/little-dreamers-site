<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Little Prince</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="game-prince-style.css">
</head>
<body>
    <a href="index.html" class="back-to-menu-btn" title="Voltar ao Menu"><i class="fas fa-arrow-left"></i></a>

    <div class="game-container">
        <nav class="story-path">
            <div id="chapter1" class="chapter-node active" data-chapter="1">
                <div class="node-icon start-button"><span>START</span></div>
                <span class="node-label">Chapter 1: The Pilot & The Asteroid</span>
            </div>
            <div id="chapter2" class="chapter-node locked" data-chapter="2">
                <div class="node-icon"><i class="fas fa-lock"></i></div>
                <span class="node-label">Chapter 2: The Rose</span>
            </div>
            <div id="chapter3" class="chapter-node locked" data-chapter="3">
                <div class="node-icon"><i class="fas fa-lock"></i></div>
                <span class="node-label">Chapter 3: The Fox</span>
            </div>
            <div id="chapter4" class="chapter-node locked" data-chapter="4">
                <div class="node-icon"><i class="fas fa-lock"></i></div>
                <span class="node-label">Chapter 4: The Goodbye</span>
            </div>
        </nav>

        <a href="minigame-prince.html" id="bonus-game-btn" class="bonus-btn hidden">
            <i class="fas fa-gamepad"></i> Play Game!
        </a>
    </div>

    <div id="locked-chapter-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Chapter Locked</h2>
            <p>You must complete the previous chapters first!</p>
            <button id="modal-ok-btn">OK</button>
        </div>
    </div>

    <div id="story-complete-modal" class="modal-overlay hidden">
        <div class="modal-content success">
            <h2>Congratulations!</h2>
            <p>You have finished the story of The Little Prince!</p>
            <button id="story-ok-btn">Awesome!</button>
        </div>
    </div>

    <script src="game-prince-script.js"></script>
</body>
</html>
